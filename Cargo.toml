[package]
name = "ouro-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1"
ouro-runtime = { git = "https://github.com/Ch4mpl00/ouro", tag = "v0.1.0" }
ouro-durable = { git = "https://github.com/Ch4mpl00/ouro", tag = "v0.1.0" }
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "query"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
maud = { version = "0.27", features = ["axum"] }
rmcp = { version = "=3.5.0", features = ["transport-streamable-http-server"] }
rust-embed = { version = "8", features = ["debug-embed"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-postgres = "0.7.18"
tempfile = "3"
tokio-util = "0.7"
http-body-util = "0.1"
rmcp = { version = "=3.5.0", features = ["client"] }
tower = { version = "0.5", features = ["util"] }
